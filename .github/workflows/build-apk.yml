# Builds the Android app on every push to main and publishes it as a GitHub Release.
# Permanent download link for the newest build:
#   https://github.com/<OWNER>/<REPO>/releases/latest/download/app.apk
#
# AI AGENTS: do NOT edit this file unless the user explicitly asks.

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # One-time setup helper: if the user uploaded project.zip (from a phone),
      # unpack it into the repo, delete the zip and commit the result.
      - name: Unpack project.zip if present
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip -x '.github/*' -d .
            rm project.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack project.zip"
            git push
          fi

      - name: Check project exists
        id: check
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Android project yet (upload project.zip). Skipping build."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.check.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.check.outputs.ok == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.check.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Optional: a fixed signing key (repo secret DEBUG_KEYSTORE_B64) lets new
      # versions install over old ones without uninstalling first.
      - name: Load signing key (optional)
        if: steps.check.outputs.ok == 'true' && env.DEBUG_KEYSTORE_B64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
          echo "APP_KEYSTORE_PATH=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"

      # If the web game loads Three.js from a CDN, bundle it into the APK so the game works offline.
      - name: Bundle Three.js for offline use
        if: steps.check.outputs.ok == 'true'
        run: |
          WWW=app/src/main/assets/www
          if [ -f "$WWW/index.html" ] && grep -q "cdn.jsdelivr.net/npm/three@" "$WWW/index.html"; then
            VER=$(grep -o "three@[0-9.]*" "$WWW/index.html" | head -1 | cut -d@ -f2)
            echo "Bundling three@$VER"
            mkdir -p /tmp/three
            curl -sSfL "https://registry.npmjs.org/three/-/three-$VER.tgz" | tar xz -C /tmp/three
            mkdir -p "$WWW/lib/three/build" "$WWW/lib/three/examples/jsm"
            cp /tmp/three/package/build/three.module*.js "$WWW/lib/three/build/"
            cp /tmp/three/package/build/three.core*.js "$WWW/lib/three/build/" 2>/dev/null || true
            for d in controls environments postprocessing shaders; do
              cp -r "/tmp/three/package/examples/jsm/$d" "$WWW/lib/three/examples/jsm/"
            done
            sed -i "s#https://cdn.jsdelivr.net/npm/three@$VER/#./lib/three/#g" "$WWW/index.html"
            grep -n "lib/three" "$WWW/index.html"
          fi

      - name: Build APK
        if: steps.check.outputs.ok == 'true'
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        if: steps.check.outputs.ok == 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk app.apk

      - name: Upload build artifact
        if: steps.check.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.apk

      - name: Publish release
        if: steps.check.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Commit: ${{ github.sha }}
            Download: https://github.com/${{ github.repository }}/releases/latest/download/app.apk
          files: app.apk
          make_latest: true
