<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>ORB ARENA</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="overlay"></div>
<div id="app"></div>
<div id="boot" class="boot">
  <div class="boot-orb"></div>
  <div class="boot-title">ORB ARENA</div>
  <div class="boot-sub" id="boot-msg">Loading 3D engine…</div>
</div>
<script type="module" src="js/app.js"></script>
<script>
  // Shows a readable message if the 3D engine fails to load.
  window.addEventListener('error', function (e) {
    var m = document.getElementById('boot-msg');
    if (m && document.getElementById('boot').style.display !== 'none') m.textContent = 'Error: ' + (e.message || 'failed to load');
  });
  setTimeout(function () {
    var b = document.getElementById('boot');
    var m = document.getElementById('boot-msg');
    if (b && b.style.display !== 'none' && m) m.textContent = 'Still loading… if this stays, check your internet connection once.';
  }, 12000);
</script>
</body>
</html>
